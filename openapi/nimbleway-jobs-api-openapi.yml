      required:
      - name
      - agent_name
      title: CreateJobRequest
      description: Payload to create a new job.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobRunList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/JobRun'
