                      - type: string
                      - type: 'null'
                      title: Entity Type
                    domain:
                      anyOf:
                      - type: string
                      - type: 'null'
                      title: Domain
                    output_schema:
                      anyOf:
                      - additionalProperties: true
                        type: object
                      - type: 'null'
                      title: Output Schema
