components:
  schemas:
    AsyncResponse:
      type: object
      properties:
        status:
          type: string
          examples:
          - success
        task:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Unique task identifier
              examples:
              - 8e8cfde8-345b-42b8-b3e2-0c61eb11e00f
            state:
              type: string
              description: Current state of the task
              enum:
              - pending
              - processing
              - completed
              - failed
              examples:
              - pending
            created_at:
              type: string
              format: date-time
              description: Task creation timestamp
              examples:
              - '2026-01-24T12:36:24.685Z'
            account_name:
              type: string
              description: The user account name
              examples:
              - my-account
            api_type:
              type: string
              description: The api endpoint used
              enum:
              - agent
              - extract
              examples:
              - extract
            modified_at:
              type: string
              format: date-time
              description: Task last modification timestamp
              examples:
              - '2026-01-24T12:36:24.685Z'
            input:
              type: object
              description: Original request input parameters
          required:
          - id
          - state
          - created_at
          - modified_at
          - input
      required:
      - status
      - task
      examples:
      - status: success
        task:
          id: 8e8cfde8-345b-42b8-b3e2-0c61eb11e00f
          state: pending
          account_name: my-account
          api_type: extract
          created_at: '2026-01-24T12:36:24.685Z'
          modified_at: '2026-01-24T12:36:24.685Z'
          input: {}
    AgentParams:
      type: object
      minProperties: 1
      description: Agent input parameters. At least one agent-specific key-value pair is required (e.g., `keyword`, `product_id`). Refer to the specific agent's documentation.
      additionalProperties: true
      properties:
        country:
          type: string
          description: Country used to access the target URL, use ISO Alpha-2 Codes
          examples:
          - US
        locale:
          type: string
          description: Language preference for the search results. Use LCID standard
          examples:
          - en
        tag:
          type: string
          description: User-defined tag for request identification
          examples:
          - campaign-2024-q1
        parse:
          type: boolean
          description: Whether to parse the response content
          examples:
          - true
    Error400:
      type: object
      title: Error400
      properties:
        status:
          type: string
          example: failed
          examples:
          - failed
        msg:
          type: string
          description: Validation error message describing what went wrong
          example: Invalid request parameters
          examples:
          - Invalid request parameters
        error:
          type: string
          description: The validation error type
          example: PARAMETERS_FAILED_JSON_SCHEMA_VALIDATION_ERROR
          examples:
          - PARAMETERS_FAILED_JSON_SCHEMA_VALIDATION_ERROR
        details:
          type: object
          description: Detailed validation error information
          example:
            schema_validation_errors:
            - instancePath: ''
              schemaPath: '#/required'
              keyword: required
              params:
                missingProperty: search_engine
              message: must have required property 'search_engine'
      required:
      - status
      - msg
      example:
        status: failed
        msg: Invalid request parameters
        error: PARAMETERS_FAILED_JSON_SCHEMA_VALIDATION_ERROR
        details:
          schema_validation_errors:
          - instancePath: ''
            schemaPath: '#/required'
            keyword: required
            params:
              missingProperty: search_engine
            message: must have required property 'search_engine'
    AgentVersionMetadata:
      properties:
        data_source:
          type: string
          title: Data Source
          description: The data source of the agent
          examples:
          - Amazon
        description:
          anyOf:
          - type: string
            title: Description
            description: The description of the agent
            examples:
            - The Amazon Product Detail Page Agent extracts structured data from individual product pages on Amazon. This agent is ideal for tracking competitor pricing, monitoring catalog changes, and powering product intelligence use cases.
          - type: 'null'
          title: Description
          description: The description of the agent
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: The tags of the agent
          examples:
          - - Ecommerce
            - Search
        domain:
          anyOf:
          - type: string
            title: Domain
            description: The domain of the agent
            examples:
            - www.amazon.com
            - www.google.com
          - type: 'null'
          title: Domain
          description: The domain of the agent
        vertical:
          anyOf:
          - type: string
            title: Category
            description: The category of the agent
            examples:
            - Ecommerce
            - Search
          - type: 'null'
        entity_type:
          anyOf:
          - type: string
            title: Entity Type
            description: The entity type of the agent
            examples:
            - Product Detail Page (PDP)
            - Search Engine Results Page (SERP)
          - type: 'null'
      type: object
      required: []
      title: AgentVersionMetadata
      description: The metadata of the agent version
    AgentBatchBody:
      type: object
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/AgentBatchInputsPayload'
            required: []
        shared_inputs:
          allOf:
          - $ref: '#/components/schemas/AgentAsyncPayload'
            required:
            - Agents
      required:
      - inputs
      - shared_inputs
      description: Request body for executing a batch of agent requests
    AgentPayload:
      type: object
      title: AgentPayload
      properties:
        agent:
          type: string
          description: The agent's name to execute
          examples:
          - google_search
        params:
          type: object
          description: The agent's input parameters, for example query, prodcut_id, etc. Depands on the agent used.
          allOf:
          - $ref: '#/components/schemas/AgentParams'
          examples:
          - params:
              keyword: iphone 17
              zip_code: '90210'
          required: []
        localization:
          description: Controls if localization sould be enabled (default false). Some agent support localization based on zip_code or store_id on the site it self. Relevant only when agent is supporting localization
          type: boolean
        formats:
          type: array
          description: Output formats to include in the response alongside `data.parsing`. By default, only structured parsed data is returned.
          items:
            type: string
            enum:
            - html
            - markdown
            - headers
            - links
      required:
      - agent
      - params
      description: Request body model for the /agent/run endpoint
    AgentAsyncPayload:
      type: object
      title: AgentPayload
      properties:
        agent:
          type: string
          description: The agent's name to execute
          examples:
          - google_search
        params:
          type: object
          description: The agent's input parameters, for example query, prodcut_id, etc. Depands on the agent used.
          allOf:
          - $ref: '#/components/schemas/AgentParams'
          - $ref: '#/components/schemas/AsyncOptions'
          examples:
          - params:
              keyword: iphone 17
              zip_code: '90210'
          required: []
        localization:
          description: Controls if localization sould be enabled (default false). Some agent support localization based on zip_code or store_id on the site it self. Relevant only when agent is supporting localization
          type: boolean
        formats:
          type: array
          description: Output formats to include in the response alongside `data.parsing`. By default, only structured parsed data is returned.
          items:
            type: string
            enum:
            - html
            - markdown
            - headers
            - links
      required:
      - agent
      - params
      description: Request body model for the /agent/run endpoint
    Error429:
      type: object
      title: Error429
      properties:
        status:
          type: string
          example: failed
          examples:
          - failed
        msg:
          type: string
          example: Rate limit exceeded
          examples:
          - Rate limit exceeded
      required:
      - status
      - msg
      example:
        status: failed
        msg: Rate limit exceeded
    AgentGenerationResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The id of the agent generation
        status:
          type: string
          title: Status
          description: The status of the agent generation
        agent_name:
          type: string
          title: Agent Name
          description: The name of the agent
        version_id:
          type: string
          format: uuid
          title: Version Id
          description: The version id of the agent
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: The summary of the agent generation
        error:
          anyOf:
          - type: string
            title: Error
            description: The error of the agent generation
          - type: 'null'
          title: Error
          description: The error of the agent generation
      type: object
      required:
      - id
      - status
      title: AgentGenerationResponse
    CreateAgentRefinementRequest:
      properties:
        prompt:
          type: string
          title: Prompt
          description: The prompt to use for the agent refinement
        from_agent:
          type: string
          title: From Agent
          description: The name of the agent to refine
          examples:
          - amazon_pdp
      type: object
      required:
      - prompt
      - from_agent
      title: CreateAgentRefinementRequest
    CreateAgentGenerationRequest:
      properties:
        prompt:
          type: string
          title: Prompt
          description: The prompt to use for the agent generation
        agent_name:
          type: string
          title: Agent Name
          description: The name of the agent to generate
        url:
          type: string
          title: Url
          description: The URL to use for the agent generation
          examples:
          - https://www.amazon.com/s?k=laptop
        metadata:
          anyOf:
          - $ref: '#/components/schemas/AgentVersionMetadata'
          - type: 'null'
          title: Metadata
          description: The metadata of the agent version
        input_schema:
          additionalProperties: true
          type: object
          title: Input Schema
          description: The input schema for the agent generation
          examples:
            type: object
            properties:
              category:
                type: string
        output_schema:
          additionalProperties: true
          type: object
          title: Output Schema
          description: The output schema for the agent generation
          examples:
            type: object
            properties:
              name:
                type: string
      type: object
      required:
      - prompt
      - url
      title: CreateAgentGenerationRequest
    AgentResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL that was extracted
        task_id:
          type: string
          format: uuid
          description: Unique identifier for the extraction task
        status:
          type: string
          description: Status of the extraction
          enum:
          - success
          - failed
        status_code:
          type: integer
          description: HTTP status code from the target website
        data:
          type: object
          description: Data from the extraction
          properties:
            html:
              type: string
              description: Raw HTML content of the page
            headers:
              type: object
              description: Response headers from the target website
            parsing:
              type: object
              description: Parsed data when parsing is enabled
            markdown:
              type: string
              description: Markdown content when markdown conversion is enabled
            cookies:
              type: object
              description: Cookies when cookie capture is enabled
            fetch_request:
              type: array
              description: Captured executed fetch requests when enabled
              items:
                type: object
            network_capture:
              type: array
              description: Captured network activity when enabled
              items:
                type: object
            browser_actions:
              type: array
              description: Browser actions results
              items:
                type: object
            screenshot:
              type: string
              description: Base64 encoded screenshot when enabled (requires rendering)
        metadata:
          type: object
          description: Metadata from the extraction
          properties:
            query_time:
              type: string
              format: date-time
              description: Timestamp when the query was executed
            input_url:
              type: string
              format: uri
              description: The original input URL
            driver:
              type: string
              description: Driver used for extraction (depends on target domain and rendering configuration)
              examples:
              - vx8
            agent:
              type: string
              description: Agent name used for extraction
              examples:
              - amazon_pdp
        warnings:
          type: array
          description: List of warnings
          items:
            type: string
      required:
      - url
      - task_id
      - status
      - status_code
      - data
      - metadata
    BatchResponse:
      type: object
      properties:
        batch_id:
          type: string
          description: Unique identifier for the batch.
        batch_size:
          type: number
          description: Number of tasks in the batch.
        tasks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                description: Unique task identifier.
                examples:
                - 123e4567-e89b-12d3-a456-426614174000
              state:
                type: string
                enum:
                - pending
                - success
                - error
                description: Current state of the task.
                examples:
                - pending
              output_url:
                description: Storage location of the output data.
                type: string
              status_url:
                type: string
                format: uri
                description: URL for checking the task status.
                examples:
                - https://sdk.nimbleway.com/v1/tasks/123e4567-e89b-12d3-a456-426614174000
              download_url:
                description: URL for downloading the task results.
                examples:
                - https://sdk.nimbleway.com/v1/tasks/123e4567-e89b-12d3-a456-426614174000/results
                type: string
                format: uri
              error:
                description: Error message if the task failed.
                examples:
                - Connection timeout
                type: string
              error_type:
                description: Classification of the error type.
                examples:
                - timeout_error
                type: string
              created_at:
                description: Timestamp when the task was created.
                examples:
                - '2024-01-15T10:30:00Z'
                type: string
              modified_at:
                description: Timestamp when the task was last modified.
                examples:
                - '2024-01-15T10:35:00Z'
                type: string
              account_name:
                description: Account name that owns the task.
                type: string
              input:
                description: Original input data for the task.
              _query: {}
              batch_id:
                description: Batch ID if this task is part of a batch.
                examples:
                - 4b0a90bf-c951-42e4-95b3-a95a65ba69fc
                type: string
              status_code:
                description: HTTP status code from the task execution.
                examples:
                - 200
                type: number
              api_type:
                type: string
                enum:
                - web
                - serp
                - ecommerce
                - social
                - media
                - agent
                - extract
            required:
            - id
            - state
            - status_url
            - created_at
            - input
            - _query
            additionalProperties: false
          description: List of created tasks.
      additionalProperties: false
      description: Response when a batch of extract tasks is created successfully.
    AgentBatchInputsPayload:
      type: object
      title: AgentBatchInputsPayload
      properties:
        params:
          type: object
          description: The agent's input parameters, for example query, prodcut_id, etc. Depands on the agent used.
          allOf:
          - $ref: '#/components/schemas/AgentParams'
          examples:
          - params:
              keyword: iphone 17
              zip_code: '90210'
          required: []
        localization:
          description: Controls if localization sould be enabled (default false). Some agent support localization based on zip_code or store_id on the site it self. Relevant only when agent is supporting localization
          type: boolean
        formats:
          type: array
          description: Output formats to include in the response alongside `data.parsing`. By default, only structured parsed data is returned.
          items:
            type: string
            enum:
            - html
            - markdown
            - headers
            - links
      required:
      - agent
      - params
      description: Request body model for the /agent/run endpoint
    Error402:
      type: object
      title: Error402
      properties:
        status:
          type: string
          example: failed
          examples:
          - failed
        msg:
          type: string
          description: Error message indicating the payment issue
          example: trial expired
          enum:
          - no budget
          - limit reached
          - trial expired
          - trial quota finished
      required:
      - status
      - msg
      example:
        status: failed
        msg: trial expired
    AsyncOptions:
      type: object
      properties:
        storage_type:
          type: string
          description: Storage type for async results. Use s3 for Amazon S3 and gs for Google Cloud Platform.
          enum:
          - s3
          - gs
          examples:
          - s3
        storage_url:
          type: string
          description: 'Repository URL where output will be saved. Format: s3://Your.Bucket.Name/your/object/name/prefix/ - Output will be saved as TASK_ID.json'
          examples:
          - s3://Your.Repository.Path/
        callback_url:
          type: string
          format: uri
          description: A URL to callback once the data is delivered. The API will send a POST request with task details (without the requested data) when the task completes.
          examples:
          - https://your.callback.url/path
        storage_compress:
          type: boolean
          description: When set to true, the response saved to storage_url will be compressed using GZIP format. If false or not set, response will be saved uncompressed.
          examples:
          - false
        storage_object_name:
          type: string
          description: Custom name for the stored object instead of the default task ID
          examples:
          - my task
    Error500:
      type: object
      title: Error500
      properties:
        success:
          type: string
          example: 'false'
          examples:
          - 'false'
        task_id:
          type: string
          example: 1ed1dbeb-8f34-4fd1-bb2d-a72bacae2ef3
          examples:
          - 1ed1dbeb-8f34-4fd1-bb2d-a72bacae2ef3
        message:
          type: string
          example: can't download the query response - please try again
          examples:
          - can't download the query response - please try again
      required:
      - success
      - task_id
      - message
      example:
