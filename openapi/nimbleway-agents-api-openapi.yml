openapi: 3.1.0
info:
  title: Nimble SDK Agents API
  version: 1.0.0
  description: The AI-Native SDK for Real-Time Web Data at scale
servers:
- url: https://sdk.nimbleway.com
tags:
- name: Agents
paths:
  /v1/agents/run:
    post:
      summary: Agent Run
      description: Execute Search Agent Realtime Endpoint
      tags:
      - Agents
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AgentPayload'
              examples:
              - agent: amazon_pdp
                params:
                  asin: B0DLKFK6LR
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AgentResponse'
                examples:
                - url: https://www.example.com/
                  task_id: e8ed8ef6-2657-43ba-98d5-a5c79ea7b551
                  status: success
                  status_code: 200
                  data:
                    html: '...'
                    markdown: MARKDOWN
                    parsing: {}
                    cookies: {}
                    screenshot: iVBORw0KGgoAAAANSUhEUgAAA...
                    fetch_request: []
                    network_capture: []
                    browser_actions: []
                    headers: {}
                  metadata:
                    query_time: '2026-02-09T10:26:05.817Z'
                    query_duration: 1877
                    response_parameters:
                      input_url: https://www.example.com/
                    driver: vx8
                    agent: agent_name
        '400':
          description: Unprocessable Entity - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error402'
        '404':
          description: Agent Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                    - failed
                  msg:
                    type: string
                    examples:
                    - Agent not found
                required:
                - status
                - msg
              example:
                status: failed
                msg: Agent not found
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /v1/agents/async:
    post:
      summary: Agent Async
      description: Execute Search Agent Async Endpoint
      tags:
      - Agents
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AgentAsyncPayload'
              examples:
              - agent: google_search
                params:
                  query: What happened last night in the NBA?
                  storage_url: s3://mu-s3-bucket.com/
                  storage_type: s3
                  callback_url: https://my-callback-url.com/
      responses:
        '200':
          description: Async Task Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResponse'
              example:
                status: success
                task:
                  id: 8e8cfde8-345b-42b8-b3e2-0c61eb11e00f
                  state: pending
                  created_at: '2026-01-24T12:36:24.685Z'
                  modified_at: '2026-01-24T12:36:24.685Z'
                  input: {}
        '400':
          description: Unprocessable Entity - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error402'
        '404':
          description: Agent Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                    - failed
                  msg:
                    type: string
                    examples:
                    - Agent not found
                required:
                - status
                - msg
              example:
                status: failed
                msg: Agent not found
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /v1/agents/batch:
    post:
      summary: Agent Batch
      tags:
      - Agents
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AgentBatchBody'
              examples:
              - inputs:
                - params:
                    keyword: iphone 15
                - params:
                    keyword: iphone 16
                - params:
                    keyword: iphone 17
                shared_inputs:
                  agent: amazon_serp
      responses:
        '200':
          description: Agent Batch Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                batch_id: 4b0a90bf-c951-42e4-95b3-a95a65ba69fc
                batch_size: 1
                tasks:
                - id: 123e4567-e89b-12d3-a456-426614174000
                  state: pending
                  output_url: string
                  created_at: '2024-01-15T10:30:00Z'
                  modified_at: '2024-01-15T10:35:00Z'
                  account_name: string
                  input: null
                  batch_id: 4b0a90bf-c951-42e4-95b3-a95a65ba69fc
                  status_code: 200
                  api_type: extract
        '400':
          description: Unprocessable Entity - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error402'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /v1/agents/generations:
    post:
      tags:
      - Agents
      summary: Generate Agent
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateAgentGenerationRequest'
              - $ref: '#/components/schemas/CreateAgentRefinementRequest'
              title: Request
              examples:
              - prompt: I want an agent for books.toscrape.com category pages
                agent_name: books_toscrape_categories_nkjansdkj
                url: books.toscrape.com
                input_schema:
                  type: object
                  properties:
                    category:
                      type: string
                output_schema:
                  type: object
                  properties:
                    name:
                      type: string
                    price:
                      type: string
                    url:
                      type: string
                    availability:
                      type: string
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGenerationResponse'
              example:
                id: 86441962-c8f5-4c24-b271-ee877d2dd865
                status: queued
                agent_name: books_toscrape_categories_nkjansdkj_2026_03_24_zco2isqi
                source_version_id: c51d09fc-c8f2-4b3a-a9bc-eaab88316217
                created_at: '2026-03-24T19:19:39.300002+00:00'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error402'
        '422':
          description: Unprocessable Entity - Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
      security:
      - BearerAuth: []
  /v1/agents/generations/{generation_id}:
    get:
      tags:
      - Agents
      summary: Get Generation
      security:
      - BearerAuth: []
      parameters:
      - name: generation_id
